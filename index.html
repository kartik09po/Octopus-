<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OCTOPUS — Influencer Marketing Agency</title>
<meta name="description" content="Octopus connects ambitious brands with the right creators to turn attention into engagement, trust and demand.">
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--ac:#9B4DFF;--vi:#c084fc;--pk:#ff4fd8;--tx:#fff;--mu:#a9a3b8;--glass:rgba(255,255,255,.05);--bd:rgba(155,77,255,.3);
--hd:'Space Grotesk',system-ui,sans-serif;--bf:'Inter',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 var(--bf);overflow-x:hidden}
h1,h2,h3{font-family:var(--hd);margin:0;line-height:1.1}
a{color:inherit;text-decoration:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
section,footer{position:relative;z-index:1;padding:96px 20px;max-width:1160px;margin:0 auto}
.grad{background:linear-gradient(90deg,var(--vi),var(--ac),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(28px,5vw,48px);margin-bottom:16px}
.sub{color:var(--mu);max-width:640px;margin:0 0 40px}
.glass{background:var(--glass);border:1px solid var(--bd);border-radius:22px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 0 30px rgba(155,77,255,.12);transition:transform .35s,box-shadow .35s,border-color .35s}
.glass:hover{box-shadow:0 0 44px rgba(155,77,255,.35);border-color:var(--ac)}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
/* nav */
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:14px 24px;transition:.3s}
nav.s{background:rgba(5,5,5,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:10px;font:700 18px var(--hd);letter-spacing:.12em}
.links{display:flex;gap:26px;font-size:14px;color:var(--mu)}
.links a:hover{color:var(--vi)}
#mb{display:none;background:none;border:1px solid var(--bd);color:#fff;border-radius:10px;padding:6px 12px;font-size:18px}
/* buttons */
.btn{display:inline-block;padding:14px 28px;border-radius:999px;font:500 15px var(--hd);border:1px solid var(--ac);cursor:pointer;transition:.3s;color:#fff;background:transparent}
.btn.p{background:linear-gradient(90deg,var(--ac),#c13bff);box-shadow:0 0 24px rgba(155,77,255,.55)}
.btn:hover{transform:translateY(-3px);box-shadow:0 0 38px rgba(155,77,255,.8)}
/* hero */
#hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-top:110px}
#hero h1{font-size:clamp(44px,9vw,104px);letter-spacing:.02em}
#hero .tag{font:500 clamp(20px,3vw,30px) var(--hd);margin:14px 0}
#hero p{max-width:480px;color:var(--mu)}
.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
.scroll{position:absolute;bottom:26px;left:50%;width:22px;height:36px;border:2px solid var(--bd);border-radius:12px}
.scroll:after{content:"";position:absolute;left:50%;top:6px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--vi);animation:sc 1.6s infinite}
@keyframes sc{50%{transform:translateY(10px);opacity:.2}}
/* cards */
.team{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:28px}
.person{padding:22px;text-align:center}
.av{width:68px;height:68px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--vi),var(--ac) 60%,#2a0a4d);display:grid;place-items:center;font:700 24px var(--hd);box-shadow:0 0 22px rgba(155,77,255,.5)}
.person small{color:var(--mu);display:block}
.cat{padding:28px;perspective:800px}
.cat .ic{font-size:44px;display:inline-block;animation:fl 4s ease-in-out infinite}
.cat:nth-child(2) .ic{animation-delay:-1.3s}.cat:nth-child(3) .ic{animation-delay:-2.6s}
@keyframes fl{50%{transform:translateY(-10px) rotate(6deg)}}
.cat h3{font-size:24px;margin:10px 0 4px}.cat .d{color:var(--mu);font-size:14px;margin-bottom:16px}
.cr{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-top:8px;border-radius:12px;background:rgba(255,255,255,.04);font-size:14px}
.cr b{color:var(--vi);font-family:var(--hd)}
.cat[data-t="0"]{--bd:rgba(255,79,216,.35)}
/* connect */
#viz{width:100%;max-width:560px;margin:40px auto 0;display:block}
.why .glass{padding:28px}.why h3{font-size:21px;margin-bottom:8px}.why p{margin:0;color:var(--mu)}
#collab{text-align:center}
#collab .sub{margin-inline:auto}
#collab .cta{justify-content:center}
.opt{display:flex;flex-direction:column;align-items:center;gap:8px}.opt small{color:var(--mu)}
footer{border-top:0;padding-bottom:48px}
.div{height:1px;background:linear-gradient(90deg,transparent,var(--ac),transparent);box-shadow:0 0 14px var(--ac);margin-bottom:36px}
.fg{display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap}
footer ul{list-style:none;margin:0;padding:0;display:flex;gap:10px 24px;flex-wrap:wrap;color:var(--mu);font-size:14px}
footer li a:hover{color:var(--vi)}
.ph{margin-top:24px;padding:14px 18px;border:1px dashed var(--bd);border-radius:12px;color:var(--mu);font-size:13px}
.cp{margin-top:28px;color:var(--mu);font-size:13px}
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s}.rv.on{opacity:1;transform:none}
@media(max-width:760px){.links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:rgba(5,5,5,.92);backdrop-filter:blur(14px);padding:18px 24px;gap:14px}
.links.o{display:flex}#mb{display:block}section{padding:70px 18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{padding:14px 6px;border-radius:14px;background:rgba(155,77,255,.1);border:1px solid var(--bd);text-align:center}
.tile b{display:block;font:700 26px var(--hd);color:var(--vi)}.tile small{display:block;color:var(--mu);font-size:11px}.tile span{display:block;font-size:12px;margin-top:6px}
.fo{padding:40px 24px;text-align:center}.fo .av{width:96px;height:96px;font-size:38px}.fo h3{font-size:28px}.fo small{color:var(--mu)}
#hero h1,#hero .tag{text-shadow:0 2px 24px #000}
a.cat{display:block;cursor:pointer}.inv{color:var(--mu);font-size:15px;margin:10px 0 18px}.go{color:var(--vi);font:500 14px var(--hd)}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<nav id="nav">
 <a href="#hero" class="logo" aria-label="Octopus home"><svg id="lg" width="34" height="34" viewBox="0 0 40 40" fill="none" stroke="#c084fc" stroke-width="2.4" stroke-linecap="round"><path d="M10 18a10 10 0 0 1 20 0v2H10z" fill="rgba(155,77,255,.35)"/><path d="M12 22c0 6-4 6-5 10M17 22c0 6-2 8-2 12M23 22c0 6 2 8 2 12M28 22c0 6 4 6 5 10"/><circle cx="16" cy="17" r="1.5" fill="#fff" stroke="none"/><circle cx="24" cy="17" r="1.5" fill="#fff" stroke="none"/></svg>OCTOPUS</a>
 <div class="links" id="links"><a href="#hero">Home</a><a href="#categories">Creators</a><a href="#founders">Founders</a><a href="#contact">Contact</a></div>
 <button id="mb" aria-label="Menu">☰</button>
</nav>

<section id="hero"><h1 class="grad">OCTOPUS</h1><div class="tag">Influencer Marketing Agency</div><div class="scroll"></div></section>

<section id="categories">
 <h2 class="rv">Our <span class="grad">Creator Network</span></h2>
 <p class="sub rv">Pick your niche — tap a card and contact us.</p>
 <div class="grid" id="cats"></div>
</section>
<section id="founders">
 <h2 class="rv">Our <span class="grad">Founders</span></h2>
 <div class="grid" id="team"></div>
</section>
<section id="contact">
 <h2 class="rv">Let's <span class="grad">Talk</span></h2>
 <div class="grid">
  <a class="glass fo rv" id="ph" href="tel:+919235192647"><div class="av">📞</div><h3>92351 92647</h3><small>Call us</small></a>
  <a class="glass fo rv" id="ig" href="https://instagram.com/krish_nna.6" target="_blank" rel="noopener"><div class="av">📸</div><h3>@krish_nna.6</h3><small>Instagram</small></a>
 </div>
</section>
<footer><div class="div"></div><div class="fg"><div class="logo" id="flogo"></div><div class="cp" style="margin:0">© 2026 Octopus. All rights reserved.</div></div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== EDIT ME ===== */
const CONFIG={
 team:[{name:"Krishna",role:"Founder"},{name:"Ansh",role:"Founder"}],
 categories:[
  {icon:"💄",title:"Beauty & Makeup",text:"Is your brand in beauty, skincare or makeup? Contact us and we'll promote it through our creators."},
  {icon:"👗",title:"Fashion & Clothing",text:"Have a fashion or clothing brand? Contact us and we'll post and promote it to the right audience."},
  {icon:"🎓",title:"Education & Courses",text:"Run courses or an education brand? Contact us and we'll get it in front of learners."}
 ]};
const $=s=>document.querySelector(s);
$("#team").innerHTML=CONFIG.team.map(m=>`<div class="glass fo rv"><div class="av">${m.name[0]}</div><h3>${m.name}</h3><small>${m.role}</small></div>`).join("");
$("#cats").innerHTML=CONFIG.categories.map((c,i)=>`<a href="#contact" class="glass cat rv" data-t="${i}"><span class="ic">${c.icon}</span><h3>${c.title}</h3><p class="inv">${c.text}</p><span class="go">Contact us ↓</span></a>`).join("");
$("#flogo").innerHTML=$("#lg").outerHTML.replace('id="lg"','')+"OCTOPUS";
/* nav */
const nav=$("#nav");addEventListener("scroll",()=>nav.classList.toggle("s",scrollY>30),{passive:true});
$("#mb").onclick=()=>$("#links").classList.toggle("o");
$("#links").onclick=()=>$("#links").classList.remove("o");
/* reveal */
const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("on");io.unobserve(x.target)}}),{threshold:.15});
document.querySelectorAll(".rv").forEach(e=>io.observe(e));
/* card tilt */
document.querySelectorAll(".cat").forEach(c=>{c.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`rotateY(${x*10}deg) rotateX(${-y*10}deg) translateY(-4px)`});c.addEventListener("pointerleave",()=>c.style.transform="")});
/* 3D galaxy + meteors */
(function(){
 if(!window.THREE)return;
 const cv=$("#bg"),low=(navigator.hardwareConcurrency||4)<=4||innerWidth<700,still=matchMedia("(prefers-reduced-motion:reduce)").matches;
 const R=new THREE.WebGLRenderer({canvas:cv,antialias:false,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,low?1.25:2));
 const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(45,1,.1,100);C.position.z=9;
 const N=low?5000:14000,pos=new Float32Array(N*3),col=new Float32Array(N*3),c=new THREE.Color(),ci=new THREE.Color(0xffc9f0),co=new THREE.Color(0x4a6bff),cm=new THREE.Color(0xa24dff);
 for(let i=0;i<N;i++){const r=Math.pow(Math.random(),1.5)*6,a=(i%3)/3*Math.PI*2+r*.85,sp=Math.pow(Math.random(),2)*(.2+r*.12)*(Math.random()<.5?-1:1),k=i*3;
  pos[k]=Math.cos(a)*r+Math.cos(a+1.57)*sp;pos[k+1]=(Math.random()-.5)*.35*(1-r/7);pos[k+2]=Math.sin(a)*r+Math.sin(a+1.57)*sp;
  c.copy(ci).lerp(cm,Math.min(1,r/3)).lerp(co,Math.max(0,(r-3)/3));col[k]=c.r;col[k+1]=c.g;col[k+2]=c.b}
 const gg=new THREE.BufferGeometry();gg.setAttribute("position",new THREE.BufferAttribute(pos,3));gg.setAttribute("color",new THREE.BufferAttribute(col,3));
 const gal=new THREE.Points(gg,new THREE.PointsMaterial({size:.04,vertexColors:true,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));
 const grp=new THREE.Group();grp.add(gal);S.add(grp);
 const core=document.createElement("canvas");core.width=core.height=64;const x=core.getContext("2d"),rg=x.createRadialGradient(32,32,0,32,32,32);rg.addColorStop(0,"rgba(255,220,250,.9)");rg.addColorStop(1,"rgba(155,77,255,0)");x.fillStyle=rg;x.fillRect(0,0,64,64);
 const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(core),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));glow.scale.set(3,3,1);grp.add(glow);
 const sn=800,sg=new THREE.BufferGeometry(),sa=new Float32Array(sn*3);for(let i=0;i<sn*3;i++)sa[i]=(Math.random()-.5)*30;
 sg.setAttribute("position",new THREE.BufferAttribute(sa,3));S.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.03,transparent:true,opacity:.6,depthWrite:false})));
 const tc=document.createElement("canvas");tc.width=128;tc.height=8;const t2=tc.getContext("2d"),lg=t2.createLinearGradient(0,0,128,0);lg.addColorStop(0,"rgba(155,77,255,0)");lg.addColorStop(.8,"rgba(200,170,255,.7)");lg.addColorStop(1,"rgba(255,255,255,1)");t2.fillStyle=lg;t2.fillRect(0,0,128,8);
 const tt=new THREE.CanvasTexture(tc),dir=new THREE.Vector2(-.8,-.6).normalize(),M=[];
 for(let i=0;i<(low?4:8);i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:tt,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));m.rotation.z=Math.atan2(dir.y,dir.x);m.visible=false;S.add(m);
  M.push({m,h:new THREE.Vector3(),sp:0,len:0,w:Math.random()*4})}
 function rs(o){o.h.set(Math.random()*14-2,4.6+Math.random()*1.5,-2+Math.random()*3);o.sp=7+Math.random()*6;o.len=1.5+Math.random()*2;o.w=Math.random()*3.5;o.m.scale.set(o.len,.05+Math.random()*.03,1);o.m.visible=false}
 M.forEach(rs);
 let mx=0,my=0,bx=0,by=0,last=0;addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});
 function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix();const m=w<760;grp.scale.setScalar(m?.55:1);bx=m?0:2.4;by=m?1.2:0}
 size();addEventListener("resize",size);
 function tick(t){requestAnimationFrame(tick);if(scrollY>innerHeight*3)return;
  const dt=Math.min(.05,(t-last)*.001);last=t;t*=.001;if(still)t=0;
  grp.position.set(bx,by,0);grp.rotation.set(1.0+my*.12,t*.06,.35+mx*.1);
  glow.scale.setScalar(3+Math.sin(t*1.5)*.2);
  if(!still)M.forEach(o=>{if(o.w>0){o.w-=dt;return}o.m.visible=true;o.h.x+=dir.x*o.sp*dt;o.h.y+=dir.y*o.sp*dt;
   o.m.position.set(o.h.x-dir.x*o.len/2,o.h.y-dir.y*o.len/2,o.h.z);if(o.h.x<-9||o.h.y<-5)rs(o)});
  cv.style.opacity=Math.max(.3,1-scrollY/innerHeight*.7);R.render(S,C)}
 requestAnimationFrame(tick);
})();
</script>
</body>
</html>
